name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quickdrop
          POSTGRES_PASSWORD: quickdrop
          POSTGRES_DB: disputes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: .

      - name: Lint check (ruff or flake8 if available)
        run: |
          pip install ruff --quiet
          ruff check backend/app --ignore E501,E402 || true
        continue-on-error: true

      - name: Run Alembic migrations
        env:
          DATABASE_URL_SYNC: postgresql://quickdrop:quickdrop@localhost:5432/disputes_test
        run: |
          cd backend
          python -m alembic upgrade head
        continue-on-error: true

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://quickdrop:quickdrop@localhost:5432/disputes_test
          DATABASE_URL_SYNC: postgresql://quickdrop:quickdrop@localhost:5432/disputes_test
          PAYSWIFT_BASE_URL: http://localhost:8081
          LLM_PROVIDER: mock
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short 2>&1 || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  docker-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
