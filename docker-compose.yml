services:
  # ── PaySwift sandbox (unchanged from original) ─────────────────────────────
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickdrop}
      POSTGRES_DB: ${POSTGRES_DB:-disputes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quickdrop} -d ${POSTGRES_DB:-disputes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      payswift:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quickdrop}:${POSTGRES_PASSWORD:-quickdrop}@postgres:5432/${POSTGRES_DB:-disputes}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-quickdrop}:${POSTGRES_PASSWORD:-quickdrop}@postgres:5432/${POSTGRES_DB:-disputes}
      PAYSWIFT_BASE_URL: http://payswift:8081
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data:ro
      - ./docs:/docs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: /api

volumes:
  pgdata:
